  (function() {
    var origin = window.location.origin;
    var escapedOrigin = origin.split("/").join("\\/");

      "https://www.re-pixs.com",
      "https://re-pixs.com",
      "https://www.repixs.com",

    ];
    
    function patchText(text) {
      if (!text || typeof text !== 'string') return text;
      var t = text;
      for (var i = 0; i < targetDomains.length; i++) {
        var domain = targetDomains[i];
        var escapedDomain = domain.split("/").join("\\/");
        t = t.split(domain).join(origin);
        t = t.split(escapedDomain).join(escapedOrigin);
      }
      return t;

    function patchObject(obj) {
      if (!obj) return obj;
      try {
        var str = JSON.stringify(obj);
        var patchedStr = patchText(str);

          configurable: true,

        });
      }
    } catch(e) { console.error("InnerHTML override failed", e); }

    // Intercept window.viewerModel

      Object.defineProperty(window, 'viewerModel', {
        get: function() { return _viewerModel; },
        set: function(val) { _viewerModel = patchObject(val); },

      });
    } catch(e) { console.error("viewerModel override failed", e); }
